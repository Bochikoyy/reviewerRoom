<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4c542" />
    <meta name="description" content="A little sunshine for your study sessions. Study notes, flashcards, practice quizzes, and a focus timer." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sunroom" />
    <title>Sunroom · Study Reviewer</title>
    <link rel="icon" type="image/svg+xml" href="/sun.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('sunroom-theme')||'light'}catch{}</script>
  </head>
  <body>
    <div id="app"></div>
    <div id="timer-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      if (['127.0.0.1', 'localhost'].includes(location.hostname) && 'serviceWorker' in navigator) {
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister()))),
          'caches' in window ? caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))) : Promise.resolve()
        ]).then(() => {
          if (navigator.serviceWorker.controller && !sessionStorage.getItem('sunroom-dev-cache-reset')) {
            sessionStorage.setItem('sunroom-dev-cache-reset', '1');
            location.reload();
          }
        });
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
